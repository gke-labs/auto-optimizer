syntax = "proto3";

package session.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/gke-labs/auto-optimizer/api/session/v1;sessionv1";

// SessionService manages agent sessions and runs turns over gRPC.
service SessionService {
  // CreateSession creates a new agent session.
  rpc CreateSession(CreateSessionRequest) returns (Session);

  // ListSessions returns all known sessions.
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);

  // GetSession returns details of a single session.
  rpc GetSession(GetSessionRequest) returns (Session);

  // ListMessages returns the message history for a session.
  rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse);

  // SendMessage appends a user message and runs one turn of the loop.
  // The stream carries events until the turn ends.
  rpc SendMessage(SendMessageRequest) returns (stream SessionEvent);
}

// Session carries session metadata and state summary.
message Session {
  string name = 1;
  string toolset = 2;
  string parent = 3;
  google.protobuf.Timestamp creation_time = 4;
  int32 message_count = 5;
}

// CreateSessionRequest specifies parameters for creating a session.
message CreateSessionRequest {
  string name = 1;
  string toolset = 2;
  string parent = 3;
}

// ListSessionsRequest requests a list of all sessions.
message ListSessionsRequest {}

// ListSessionsResponse contains the list of sessions.
message ListSessionsResponse {
  repeated Session sessions = 1;
}

// GetSessionRequest requests details of a specific session.
message GetSessionRequest {
  string name = 1;
}

// ListMessagesRequest requests the message history of a specific session.
message ListMessagesRequest {
  string name = 1;
}

// ListMessagesResponse contains the list of messages in a session.
message ListMessagesResponse {
  repeated Message messages = 1;
}

// SendMessageRequest sends a user prompt to a session and initiates a turn.
message SendMessageRequest {
  string name = 1;
  string text = 2;
}

// Message mirrors llm.Message: role, content, tool calls, and tool call ID.
message Message {
  string role = 1;
  string content = 2;
  repeated ToolCall tool_calls = 3;
  string tool_call_id = 4;
}

// ToolCall represents a function call requested by the LLM.
message ToolCall {
  string id = 1;
  string type = 2;
  FunctionCall function = 3;
}

// FunctionCall describes the name and arguments of a tool invocation.
message FunctionCall {
  string name = 1;
  string arguments = 2;
}

// SessionEvent represents an event occurring during a turn of SendMessage.
message SessionEvent {
  oneof event {
    MessageAppended message_appended = 1;
    ToolCallStarted tool_call_started = 2;
    ToolCallFinished tool_call_finished = 3;
    TurnFinished turn_finished = 4;
    Error error = 5;
  }
  reserved 6;
  reserved "approval_requested";
}

// MessageAppended is emitted whenever a message is added to session history.
message MessageAppended {
  Message message = 1;
}

// ToolCallStarted is emitted immediately before an approved tool executes.
message ToolCallStarted {
  ToolCall tool_call = 1;
}

// ToolCallFinished is emitted after a tool execution completes.
message ToolCallFinished {
  ToolCall tool_call = 1;
  string error = 2;
}

// TurnFinished is emitted when a turn ends with final assistant text.
message TurnFinished {
  string text = 1;
}

// Error is emitted when a turn fails.
message Error {
  string message = 1;
}
